# Local development / server deployment for the BACKEND services.
# - The database is Supabase (cloud), so there is no database container here.
# - The frontend is deployed on Vercel; run it locally with `npm run dev` inside /frontend.
#
# Usage:  cp .env.example .env   (fill it in)   then   docker compose up --build
services:
  backend:
    build: ./backend
    env_file: .env
    environment:
      PORT: 5000
    ports:
      # Bound to loopback on purpose: NGINX on the host proxies to it. Publishing on
      # 0.0.0.0 would expose the API directly, bypassing TLS and the reverse proxy.
      - "127.0.0.1:5000:5000"
    restart: unless-stopped

  analytics:
    build: ./analytics
    env_file: .env
    ports:
      # Internal only - the analytics service is never publicly reachable.
      - "127.0.0.1:8000:8000"
    restart: unless-stopped
