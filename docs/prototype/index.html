<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SCEMS Prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<!--
  SCEMS clickable prototype - Role 7 (UI/UX).
  A design reference for Roles 4 and 5, NOT application code. No backend, all data is fake and lives in memory.
  Follows docs/DESIGN-SYSTEM.md and docs/SRS.md. Open this file directly in a browser.
-->
<style>
:root {
  --navy: #1B2A4A; --navy-light: #253659; --navy-dark: #111B30;
  --teal: #2A9D8F; --teal-dark: #1E7268; --teal-darker: #185E56; --teal-light: #3AB5A5; --teal-bg: #E6F5F3;
  --gray-50: #F8F9FA; --gray-100: #F1F3F5; --gray-200: #E9ECEF; --gray-300: #DEE2E6; --gray-400: #CED4DA;
  --gray-500: #ADB5BD; --gray-600: #6C757D; --gray-700: #495057; --gray-800: #343A40;
  --success: #2ECC71; --success-bg: #D4F5E2; --success-fg: #1A7A40;
  --warning: #F39C12; --warning-bg: #FEF3CD; --warning-fg: #856404;
  --danger: #E74C3C; --danger-strong: #C0392B; --danger-bg: #FDE8E8; --danger-fg: #A12D2D;
  --info-bg: #E8ECF3;
  --radius: 12px; --radius-sm: 8px; --shadow: 0 2px 12px rgba(27,42,74,0.10); --tr: 0.18s ease;
  --font: 'IBM Plex Sans Arabic', 'Segoe UI', Tahoma, Arial, sans-serif;
}
.ic { width: 1em; height: 1em; flex-shrink: 0; vertical-align: -0.15em; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.ic.fill { fill: currentColor; stroke: none; }
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: var(--font); background: var(--gray-50); color: var(--gray-800); font-size: 14px; line-height: 1.6; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--teal); outline-offset: 2px; }

/* Prototype controls (not part of the product UI) */
.proto-bar { background: #fff; border-bottom: 2px dashed var(--gray-300); padding: 8px 16px; display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; font-size: 12px; color: var(--gray-600); }
.proto-bar strong { color: var(--gray-700); }
.proto-bar[hidden], .show-bar[hidden] { display: none; }
.show-bar { position: fixed; bottom: 16px; inset-inline-start: 16px; z-index: 40; background: #fff; border: 1px dashed var(--gray-400); color: var(--gray-600); border-radius: 999px; padding: 6px 14px; font-size: 12px; opacity: .55; }
.show-bar:hover { opacity: 1; }
.proto-bar select { padding: 3px 8px; border: 1px solid var(--gray-300); border-radius: 6px; background: #fff; font-size: 12px; }
.proto-bar .seg { display: inline-flex; border: 1px solid var(--gray-300); border-radius: 6px; overflow: hidden; }
.proto-bar .seg button { border: 0; background: #fff; padding: 3px 10px; font-size: 12px; }
.proto-bar .seg button[aria-pressed="true"] { background: var(--navy); color: #fff; }

/* App chrome */
.topbar { background: var(--navy); color: #fff; height: 56px; display: flex; align-items: center; gap: 12px; padding-inline: 16px; position: sticky; top: 0; z-index: 20; }
.brand { display: flex; align-items: center; gap: 8px; font-weight: 700; white-space: nowrap; background: none; border: 0; color: #fff; }
.brand-icon { width: 32px; height: 32px; border-radius: 8px; background: var(--teal-dark); display: grid; place-items: center; font-weight: 800; }
.nav { display: flex; gap: 4px; margin-inline-start: 12px; overflow-x: auto; }
.nav button { background: none; border: 0; color: #C9D2E3; padding: 6px 12px; border-radius: 8px; white-space: nowrap; font-size: 13px; }
.nav button:hover { background: var(--navy-light); color: #fff; }
.nav button[aria-current="page"] { background: var(--navy-light); color: #fff; box-shadow: inset 0 -2px 0 var(--teal); }
.top-actions { margin-inline-start: auto; display: flex; align-items: center; gap: 8px; }
.icon-btn { position: relative; background: rgba(255,255,255,.12); border: 0; color: #fff; width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; }
.icon-btn .count { position: absolute; top: -2px; inset-inline-end: -2px; background: var(--danger-strong); color: #fff; font-size: 10px; min-width: 17px; height: 17px; border-radius: 9px; display: grid; place-items: center; padding-inline: 4px; }
.lang-toggle { background: rgba(255,255,255,.12); border: 0; color: #fff; padding: 5px 12px; border-radius: 999px; font-size: 12px; }
.menu-btn { display: none; }
@media (max-width: 860px) {
  .nav { display: none; position: absolute; top: 56px; inset-inline: 0; background: var(--navy); flex-direction: column; padding: 8px; margin: 0; }
  .nav.open { display: flex; }
  .menu-btn { display: grid; }
  .user-chip .name { display: none; }
}
.user-chip { display: flex; align-items: center; gap: 8px; font-size: 13px; }
.avatar { width: 34px; height: 34px; border-radius: 50%; background: var(--teal-bg); color: var(--teal-dark); display: inline-grid; place-items: center; font-weight: 700; font-size: 13px; flex-shrink: 0; }

main { max-width: 1100px; margin: 0 auto; padding: 24px 16px 64px; }
.page-head { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 12px; margin-bottom: 20px; }
.page-head h1 { font-size: 20px; color: var(--navy); }
.page-head p { color: var(--gray-600); font-size: 13px; }
.fr { display: inline-block; font-size: 10px; font-weight: 600; color: var(--teal-dark); background: var(--teal-bg); padding: 1px 8px; border-radius: 999px; margin-inline-start: 6px; vertical-align: middle; }
.back { background: none; border: 0; color: var(--teal-dark); font-weight: 600; margin-bottom: 12px; display: inline-flex; gap: 4px; align-items: center; }
.flip { display: inline-block; }
[dir="ltr"] .flip { transform: scaleX(-1); }

/* Components */
.card { background: #fff; border: 1px solid var(--gray-200); border-radius: var(--radius); box-shadow: var(--shadow); padding: 24px; }
.card + .card { margin-top: 16px; }
.card h2 { font-size: 16px; color: var(--navy); margin-bottom: 12px; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; border: 1.5px solid transparent; border-radius: var(--radius-sm); padding: 8px 18px; font-size: 13px; font-weight: 600; transition: background var(--tr); white-space: nowrap; }
.btn-primary { background: var(--teal-dark); color: #fff; }
.btn-primary:hover { background: var(--teal-darker); }
.btn-secondary { background: transparent; border-color: var(--teal-dark); color: var(--teal-dark); }
.btn-secondary:hover { background: var(--teal-bg); }
.btn-navy { background: var(--navy); color: #fff; }
.btn-navy:hover { background: var(--navy-dark); }
.btn-danger { background: var(--danger-strong); color: #fff; }
.btn-ghost { background: none; color: var(--gray-700); border-color: var(--gray-300); }
.btn-ghost:hover { background: var(--gray-100); }
.btn-sm { padding: 4px 12px; font-size: 12px; }
.btn-block { width: 100%; padding: 11px 18px; font-size: 14px; }
.btn:disabled { background: var(--gray-200); color: var(--gray-600); border-color: transparent; cursor: not-allowed; }
.field { margin-bottom: 16px; }
.field label { display: block; font-size: 12px; font-weight: 600; color: var(--gray-700); margin-bottom: 5px; }
.field .hint { font-size: 12px; color: var(--gray-600); margin-top: 4px; }
.field .err { font-size: 12px; color: var(--danger-fg); margin-top: 4px; }
.input, select.input, textarea.input { width: 100%; padding: 10px 12px; border: 1.5px solid var(--gray-300); border-radius: var(--radius-sm); background: #fff; font-size: 13px; transition: border-color var(--tr); }
.input:focus { border-color: var(--teal); outline: none; }
.input.invalid { border-color: var(--danger); }
textarea.input { min-height: 96px; resize: vertical; }
.badge { display: inline-flex; align-items: center; gap: 4px; padding: 2px 10px; border-radius: 999px; font-size: 11px; font-weight: 600; white-space: nowrap; }
.b-teal { background: var(--teal-bg); color: var(--teal-dark); }
.b-success { background: var(--success-bg); color: var(--success-fg); }
.b-warning { background: var(--warning-bg); color: var(--warning-fg); }
.b-danger { background: var(--danger-bg); color: var(--danger-fg); }
.b-info { background: var(--info-bg); color: var(--navy); }
.b-gray { background: var(--gray-200); color: var(--gray-600); }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { padding: 5px 14px; border-radius: 999px; border: 1.5px solid var(--gray-300); background: #fff; color: var(--gray-600); font-size: 12px; }
.chip[aria-pressed="true"] { background: var(--teal-bg); border-color: var(--teal-dark); color: var(--teal-dark); font-weight: 600; }
.search { display: flex; align-items: center; gap: 8px; background: #fff; border: 1.5px solid var(--gray-300); border-radius: 999px; padding: 6px 16px; }
.search:focus-within { border-color: var(--teal); }
.search input { border: 0; outline: 0; flex: 1; background: transparent; padding: 4px 0; min-width: 0; }
.search button { background: none; border: 0; color: var(--gray-600); font-size: 12px; }
.progress { height: 6px; background: var(--gray-200); border-radius: 999px; overflow: hidden; }
.progress > span { display: block; height: 100%; border-radius: 999px; }
.muted { color: var(--gray-600); font-size: 13px; }
.small { font-size: 12px; }
.row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.spread { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.grid { display: grid; gap: 16px; }
.g2 { grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); }
.g4 { grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); }
.stack > * + * { margin-top: 12px; }
.open-note { border: 1.5px dashed var(--warning); background: #FFFBEB; color: var(--warning-fg); border-radius: var(--radius-sm); padding: 10px 14px; font-size: 12px; margin-bottom: 16px; }
.open-note strong { color: #6B4F00; }

/* Event card */
.ev { background: #fff; border: 1px solid var(--gray-200); border-radius: var(--radius); overflow: hidden; display: flex; flex-direction: column; text-align: start; transition: box-shadow var(--tr); padding: 0; }
.ev:hover { box-shadow: var(--shadow); }
.ev-banner { height: 104px; position: relative; overflow: hidden; color: #fff; display: flex; align-items: flex-end; padding: 12px 14px; }
.ev-banner .bg-ic { position: absolute; inset-inline-end: -14px; bottom: -22px; font-size: 112px; opacity: .16; stroke-width: 1.5; }
.ev-banner .badge { position: absolute; top: 10px; inset-inline-end: 10px; }
.datebox { background: rgba(255,255,255,.95); color: var(--navy); border-radius: 8px; padding: 4px 10px; text-align: center; line-height: 1.15; position: relative; }
.datebox b { display: block; font-size: 18px; }
.datebox span { font-size: 11px; color: var(--gray-600); }
.ev-body { padding: 14px 16px 16px; display: flex; flex-direction: column; gap: 6px; flex: 1; }
.ev-title { font-weight: 700; color: var(--navy); font-size: 15px; }
.ev-title, .bidi { unicode-bidi: plaintext; text-align: start; }
.meta { display: flex; gap: 6px; align-items: center; color: var(--gray-600); font-size: 12px; }
.cat-workshop { background: var(--teal-dark); }
.cat-seminar { background: var(--navy-light); }
.cat-competition { background: #8A4B22; }
.cat-cultural { background: #5B4A7A; }
.cat-sports { background: #2E6B4F; }
.cat-other { background: var(--gray-700); }

/* Tables */
.table-wrap { overflow-x: auto; border: 1px solid var(--gray-200); border-radius: var(--radius); background: #fff; }
table { width: 100%; border-collapse: collapse; font-size: 13px; }
th { text-align: start; font-size: 12px; color: var(--gray-600); font-weight: 600; background: var(--gray-50); padding: 10px 14px; border-bottom: 1px solid var(--gray-200); white-space: nowrap; }
td { padding: 10px 14px; border-bottom: 1px solid var(--gray-100); vertical-align: middle; }
tr:last-child td { border-bottom: 0; }

/* Stat */
.stat { background: #fff; border: 1px solid var(--gray-200); border-radius: var(--radius); padding: 16px; }
.stat .v { font-size: 26px; font-weight: 700; color: var(--navy); line-height: 1.2; }
.stat .l { font-size: 12px; color: var(--gray-600); }

/* Info tiles */
.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 10px; }
.tile { background: var(--gray-50); border-radius: var(--radius-sm); padding: 10px 12px; }
.tile .l { font-size: 11px; color: var(--gray-600); }
.tile .v { font-weight: 600; color: var(--gray-800); }

/* QR */
.qr { width: 168px; height: 168px; margin: 0 auto; padding: 10px; background: #fff; border: 1px solid var(--gray-300); border-radius: var(--radius-sm); display: grid; grid-template-columns: repeat(21, 1fr); }
.qr i { display: block; }
.qr i.on { background: var(--gray-800); }

/* Tabs */
.tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--gray-200); margin-bottom: 16px; overflow-x: auto; }
.tabs button { background: none; border: 0; padding: 8px 14px; color: var(--gray-600); font-weight: 600; font-size: 13px; border-bottom: 2px solid transparent; white-space: nowrap; }
.tabs button[aria-selected="true"] { color: var(--teal-dark); border-bottom-color: var(--teal-dark); }

/* Booking row */
.bk { display: flex; gap: 12px; align-items: center; background: #fff; border: 1px solid var(--gray-200); border-inline-start: 4px solid var(--teal); border-radius: var(--radius-sm); padding: 12px 14px; flex-wrap: wrap; }
.bk.past, .bk.cancelled { border-inline-start-color: var(--gray-400); }
.bk .ico { width: 42px; height: 42px; border-radius: 10px; display: grid; place-items: center; font-size: 20px; color: #fff; flex-shrink: 0; }
.bk .info { flex: 1; min-width: 180px; }

/* Stepper */
.steps { display: flex; gap: 8px; margin-bottom: 20px; }
.step { flex: 1; display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--gray-600); }
.step .n { width: 28px; height: 28px; border-radius: 50%; background: var(--gray-200); display: grid; place-items: center; font-weight: 700; flex-shrink: 0; }
.step.active .n { background: var(--teal-dark); color: #fff; }
.step.done .n { background: var(--success-bg); color: var(--success-fg); }
.step.active { color: var(--navy); font-weight: 600; }
.step::after { content: ""; flex: 1; height: 2px; background: var(--gray-200); }
.step:last-child::after { display: none; }

/* Notifications */
.nt { display: flex; gap: 12px; padding: 14px 16px; border-bottom: 1px solid var(--gray-100); }
.nt:last-child { border-bottom: 0; }
.nt .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--gray-400); margin-top: 7px; flex-shrink: 0; }
.nt.unread .dot { background: var(--teal); }
.nt.unread .t { font-weight: 700; }

/* Bars */
.bars { display: flex; align-items: flex-end; gap: 10px; height: 180px; padding-top: 10px; }
.bar-col { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 6px; height: 100%; justify-content: flex-end; }
.bar { width: 100%; max-width: 44px; background: var(--teal); border-radius: 4px 4px 0 0; }
.bar.pred { background: repeating-linear-gradient(45deg, var(--teal-bg), var(--teal-bg) 4px, #fff 4px, #fff 8px); border: 1.5px dashed var(--teal-dark); }
.bar-col .l { font-size: 11px; color: var(--gray-600); }
.bar-col .v { font-size: 11px; font-weight: 600; color: var(--gray-700); }
.hbar { display: grid; grid-template-columns: 110px 1fr 44px; gap: 10px; align-items: center; font-size: 13px; margin-bottom: 10px; }

/* Chat */
.chat { display: flex; flex-direction: column; height: min(640px, calc(100vh - 210px)); padding: 0; overflow: hidden; }
.chat-head { background: var(--navy); color: #fff; padding: 12px 16px; display: flex; gap: 10px; align-items: center; }
.chat-log { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 10px; background: var(--gray-50); }
.bubble { max-width: 75%; padding: 9px 13px; border-radius: 16px; font-size: 13px; white-space: pre-line; }
.bubble.bot { background: #fff; border: 1px solid var(--gray-200); align-self: flex-start; border-start-start-radius: 4px; }
.bubble.user { background: var(--teal-dark); color: #fff; align-self: flex-end; border-start-end-radius: 4px; }
.chat-foot { padding: 12px; border-top: 1px solid var(--gray-200); background: #fff; }

/* Empty / skeleton */
.empty { text-align: center; padding: 48px 16px; }
.empty .ico { font-size: 44px; margin-bottom: 8px; color: var(--gray-400); }
.icon-btn { font-size: 18px; }
.bk .ico .ic { stroke-width: 1.75; }
.meta .ic { color: var(--gray-500); }
.empty h3 { color: var(--navy); font-size: 16px; margin-bottom: 4px; }
.empty p { color: var(--gray-600); font-size: 13px; margin-bottom: 16px; }
.sk { background: linear-gradient(90deg, var(--gray-200), var(--gray-100), var(--gray-200)); background-size: 200% 100%; animation: sk 1.2s infinite; border-radius: var(--radius); }
@keyframes sk { from { background-position: 200% 0; } to { background-position: -200% 0; } }

/* Modal + toast */
.modal-back { position: fixed; inset: 0; background: rgba(17,27,48,.45); display: grid; place-items: center; z-index: 50; padding: 16px; }
.modal { background: #fff; border-radius: var(--radius); max-width: 440px; width: 100%; padding: 24px; box-shadow: 0 10px 40px rgba(0,0,0,.2); }
.modal h3 { color: var(--navy); margin-bottom: 8px; font-size: 17px; }
.modal .actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 20px; }
.toast { position: fixed; bottom: 20px; inset-inline-start: 50%; transform: translateX(-50%); background: var(--navy); color: #fff; padding: 10px 18px; border-radius: 999px; font-size: 13px; z-index: 60; box-shadow: var(--shadow); }
[dir="rtl"] .toast { transform: translateX(50%); }

/* Auth */
.auth-wrap { display: grid; grid-template-columns: 1fr; gap: 32px; align-items: center; max-width: 1000px; margin: 0 auto; }
.auth-hero { display: none; }
@media (min-width: 900px) {
  .auth-wrap { grid-template-columns: 1fr 1fr; min-height: calc(100vh - 140px); }
  .auth-hero { display: flex; flex-direction: column; justify-content: center; align-self: stretch; margin: 32px 0; background: var(--navy); color: #fff; border-radius: 16px; padding: 40px; position: relative; overflow: hidden; }
}
.auth-hero h2 { font-size: 26px; line-height: 1.35; margin-bottom: 10px; }
.auth-hero p { color: #C9D2E3; margin-bottom: 28px; }
.auth-hero ul { list-style: none; display: grid; gap: 14px; position: relative; }
.auth-hero li { display: flex; gap: 12px; align-items: flex-start; }
.auth-hero li .ic { font-size: 20px; color: var(--teal-light); margin-top: 2px; }
.auth-hero .deco { position: absolute; inset-inline-end: -40px; bottom: -40px; font-size: 220px; opacity: .07; }
.auth { max-width: 420px; width: 100%; margin: 32px auto; }
.auth .logo { width: 56px; height: 56px; border-radius: 14px; background: var(--navy); color: #fff; display: grid; place-items: center; font-size: 26px; font-weight: 800; margin: 0 auto 12px; }
.auth h1 { text-align: center; color: var(--navy); font-size: 20px; }
.auth .sub { text-align: center; color: var(--gray-600); font-size: 13px; margin-bottom: 20px; }
.alert { border-radius: var(--radius-sm); padding: 10px 12px; font-size: 13px; margin-bottom: 16px; }
.alert-danger { background: var(--danger-bg); color: var(--danger-fg); }
.alert-success { background: var(--success-bg); color: var(--success-fg); }
.layout-2 { display: grid; grid-template-columns: 1fr; gap: 16px; }
@media (min-width: 900px) { .layout-2 { grid-template-columns: 2fr 1fr; } }
.dropzone { border: 2px dashed var(--gray-300); border-radius: var(--radius-sm); padding: 24px; text-align: center; color: var(--gray-600); font-size: 13px; background: var(--gray-50); }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
</style>
</head>
<body>
<div class="proto-bar" id="protoBar"></div>
<div id="app"></div>
<div id="layer"></div>

<script>
'use strict';
// ---------------------------------------------------------------- i18n
// Arabic terms match frontend/messages/ar.json (حاضر / منظم / مشرف, error messages).
const T = {
  ar: {
    product: 'نظام إدارة فعاليات الحرم الجامعي الذكي', short: 'SCEMS', uni: 'جامعة حائل', notesToggle: 'ملاحظات المراجعة', presentMode: 'وضع العرض', showControls: 'إظهار عناصر التحكم', eventsCount: 'عدد الفعاليات', usersN: n => `${n} ${{ one: 'مستخدم', two: 'مستخدمان', few: 'مستخدمين', many: 'مستخدمًا', other: 'مستخدم' }[new Intl.PluralRules('ar').select(+String(n).replace(/\D/g, ''))]}`,
    showingOf: (a, b) => `يعرض ${a} من أصل ${b}`,
    heroTitle: 'كل فعاليات جامعة حائل في مكان واحد', heroSub: 'اكتشف الفعاليات المعتمدة، واحجز مقعدك في ثوانٍ، وادخل برمز QR.', f1: 'تصفح الفعاليات حسب التصنيف والقاعة والتاريخ', f2: 'احجز مقعدك أو ألغِ حجزك بخطوة واحدة، مع تذكرة QR', f3: 'إشعارات فورية بتأكيد الحجز وبأي تغيير على فعالياتك', switchLang: 'English',

function go(screen, params = {}) {
  const def = SCREENS.find(s => s[0] === screen);
  if (def && def[1] && S.role !== def[1] && screen !== 'notifications' && screen !== 'chat') S.role = def[1];
  if ((screen === 'notifications' || screen === 'chat') && !S.role) S.role = 'ATTENDEE';
  if (screen === 'details' && !params.id) params.id = 'e1';
  if (screen === 'booked' && !params.reg) params.reg = 'r1';
  if (screen === 'feedback' && !params.reg) params.reg = 'r2';
  if (screen === 'attendees' && !params.id) params.id = 'e1';
  if (screen === 'create' && !params.keep) S.wizard = null;
  if (screen === 'login' || screen === 'register') S.role = null;
  S.screen = screen; S.params = params; S.navOpen = false; S.state = 'normal';
  render(); window.scrollTo(0, 0);
}

function modal({ title, body, confirmLabel, danger, onConfirm, content }) {
  const layer = document.getElementById('layer');
  layer.innerHTML = `<div class="modal-back" data-close><div class="modal" role="dialog" aria-modal="true" aria-labelledby="mt">
    <h3 id="mt">${esc(title)}</h3>${body ? `<p class="muted">${esc(body)}</p>` : ''}${content || ''}
    <div class="actions"><button class="btn btn-ghost" data-close>${t('cancel')}</button>
    <button class="btn ${danger ? 'btn-danger' : 'btn-primary'}" id="mOk">${esc(confirmLabel || t('confirm'))}</button></div></div></div>`;
  const closeM = () => { layer.innerHTML = ''; };
  layer.querySelectorAll('[data-close]').forEach(el => el.addEventListener('click', e => { if (e.target === el) closeM(); }));
  document.getElementById('mOk').addEventListener('click', () => { if (onConfirm() !== false) closeM(); });
  const first = layer.querySelector('.modal input, .modal select') || document.getElementById('mOk'); first.focus();
  layer.querySelector('.modal-back').addEventListener('keydown', e => { if (e.key === 'Escape') closeM(); });
}
let toastTimer;
function toast(msg) {
  let el = document.querySelector('.toast');
  if (!el) { el = document.createElement('div'); el.className = 'toast'; el.setAttribute('role', 'status'); document.body.appendChild(el); }
  el.textContent = msg; clearTimeout(toastTimer); toastTimer = setTimeout(() => el.remove(), 2600);
}

function qr(seed) {
  let h = 0; for (const ch of seed) h = (h * 31 + ch.charCodeAt(0)) >>> 0;
  const cells = [];
  for (let y = 0; y < 21; y++) for (let x = 0; x < 21; x++) {
    const finder = (a, b) => x >= a && x < a + 7 && y >= b && y < b + 7;
    let on;
    if (finder(0, 0) || finder(14, 0) || finder(0, 14)) {
      const fx = x >= 14 ? x - 14 : x, fy = y >= 14 ? y - 14 : y;
      on = fx === 0 || fx === 6 || fy === 0 || fy === 6 || (fx >= 2 && fx <= 4 && fy >= 2 && fy <= 4);
    } else { h = (h * 1103515245 + 12345) >>> 0; on = (h >> 16) % 2 === 0; }
    cells.push(`<i class="${on ? 'on' : ''}"></i>`);
  }
  return `<div class="qr" role="img" aria-label="QR ${esc(seed)}">${cells.join('')}</div>`;
}

      <td style="min-width:120px">${fmtN(e.booked)}/${fmtN(e.capacity)}<div class="progress"><span style="width:${Math.min(100, e.booked / e.capacity * 100)}%;background:${CAP[capState(e)][1]}"></span></div></td>
      <td><span class="badge ${STATUS_B[e.status]}">${t(e.status)}</span></td>
      <td><div class="row" style="flex-wrap:nowrap">${e.status === 'APPROVED' ? `<button class="btn btn-secondary btn-sm" data-go="attendees" data-id="${e.id}">${t('attendeesBtn')}</button>` : ''}
        ${!isPast(e) ? `<button class="btn btn-ghost btn-sm" data-act="editEv" data-id="${e.id}">${t('edit')}</button><button class="btn btn-ghost btn-sm" style="color:var(--danger-fg)" data-act="delEv" data-id="${e.id}">${t('delete')}</button>` : ''}</div></td></tr>`).join('')}
    </tbody></table></div>` : empty('calendar', t('noOrgEvents'), t('noOrgEventsSub'), `<button class="btn btn-primary" data-go="create">${ico('plus')} ${t('nav_create')}</button>`));
};

V.create = () => {
  if (!S.wizard) S.wizard = { step: 1, errors: {}, d: { title: '', desc: '', titleEn: '', descEn: '', cat: '', venue: '', start: '', end: '', capacity: '' } };
  const w = S.wizard, d = w.d, er = w.errors, editing = !!w.editId;
  const f = (id, label, inner) => `<div class="field"><label for="w_${id}">${label} *</label>${inner}${er[id] ? `<div class="err" id="w_${id}-e">${t(er[id])}</div>` : ''}</div>`;
  const inp = (id, type = 'text', extra = '') => `<input class="input ${er[id] ? 'invalid' : ''}" id="w_${id}" data-w="${id}" type="${type}" value="${esc(d[id])}" ${extra} ${er[id] ? `aria-invalid="true" aria-describedby="w_${id}-e"` : ''}>`;
  const ta = (id, dir) => `<textarea class="input ${er[id] ? 'invalid' : ''}" id="w_${id}" data-w="${id}" dir="${dir}">${esc(d[id])}</textarea>`;
  const v = venue(d.venue);
  let body;
  if (w.step === 1) body = `<div>
      ${f('title', t('evTitle'), inp('title', 'text', 'dir="auto" maxlength="120"'))}
      ${f('desc', t('evDesc'), ta('desc', 'auto'))}</div>
      <details class="card" style="padding:12px 16px;box-shadow:none;margin-bottom:16px" ${d.titleEn || d.descEn ? 'open' : ''}>
        <summary style="cursor:pointer;font-weight:600;color:var(--teal-dark)">${t('enOptional')}</summary>
        ${openNote('openEnTitle')}
        <p class="hint" style="margin:8px 0 12px">${t('enHint')}</p>
        <div class="field"><label for="w_titleEn">${t('titleEnL')}</label><input class="input" id="w_titleEn" data-w="titleEn" dir="ltr" maxlength="120" value="${esc(d.titleEn)}"></div>
        <div class="field" style="margin-bottom:0"><label for="w_descEn">${t('descEnL')}</label><textarea class="input" id="w_descEn" data-w="descEn" dir="ltr">${esc(d.descEn)}</textarea></div>
      </details>
      ${f('cat', t('category'), `<select class="input ${er.cat ? 'invalid' : ''}" id="w_cat" data-w="cat"><option value="">${t('choose')}</option>${CATS.map(c => `<option value="${c.id}" ${d.cat === c.id ? 'selected' : ''}>${esc(L(c))}</option>`).join('')}</select>`)}
      <div class="field"><label>${t('image')} ${fr('16')}</label><div class="dropzone">${ico('image')} ${t('dropzone')}</div></div>`;
  else if (w.step === 2) body = `<div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:0 16px">
      ${f('start', t('startsAt'), inp('start', 'datetime-local'))}${f('end', t('endsAt'), inp('end', 'datetime-local'))}</div>
      ${f('venue', t('venue'), `<select class="input ${er.venue ? 'invalid' : ''}" id="w_venue" data-w="venue"><option value="">${t('choose')}</option>${VENUES.map(x => `<option value="${x.id}" ${d.venue === x.id ? 'selected' : ''}>${esc(L(x))}</option>`).join('')}</select>`)}
      ${f('capacity', `${t('capacity')} ${fr('13')}`, inp('capacity', 'number', `min="1" ${v ? `max="${v.capacity}"` : ''}`))}
      ${v ? `<div class="hint" style="margin-top:-10px;margin-bottom:12px">${t('capHint', fmtN(v.capacity))}</div>` : ''}`;
  else body = `<div class="tiles">
      <div class="tile" style="grid-column:1/-1"><div class="l">${t('evTitle')}</div><div class="v" dir="auto">${esc(d.title)}</div></div>
      ${d.titleEn.trim() ? `<div class="tile" style="grid-column:1/-1"><div class="l">${t('titleEnL')}</div><div class="v" dir="ltr">${esc(d.titleEn)}</div></div>` : ''}

      <div class="tile"><div class="l">${t('category')}</div><div class="v">${esc(L(cat(d.cat)))}</div></div>
      <div class="tile"><div class="l">${t('venue')}</div><div class="v">${esc(L(v))}</div></div>
      <div class="tile"><div class="l">${t('when')}</div><div class="v">${fmtDT(new Date(d.start))}</div><div class="small muted">→ ${fmtTime(new Date(d.end))}</div></div>
      <div class="tile"><div class="l">${t('capacity')}</div><div class="v">${fmtN(+d.capacity)}</div></div></div>
      ${editing ? '' : `<div class="alert" style="background:var(--info-bg);color:var(--navy);margin-top:16px">${ico('info')} ${t('createSub')}</div>`}`;
  const steps = ['s1', 's2', 's3'].map((k, i) => `<div class="step ${w.step === i + 1 ? 'active' : w.step > i + 1 ? 'done' : ''}" ${w.step === i + 1 ? 'aria-current="step"' : ''}><span class="n">${w.step > i + 1 ? ico('check') : fmtN(i + 1)}</span>${t(k)}</div>`).join('');
  return `<button class="back" data-go="orgEvents"><span class="flip">→</span> ${t('back')}</button>` +
    pageHead(editing ? t('editTitle') : t('createTitle'), editing ? '' : t('createSub'), editing ? ['11'] : ['10', '13', '16']) +
    `<div class="card" style="max-width:760px"><div class="steps">${steps}</div>${body}
    <div class="spread" style="margin-top:20px">${w.step > 1 ? `<button class="btn btn-ghost" data-act="wPrev"><span class="flip">→</span> ${t('prev')}</button>` : '<span></span>'}
    ${w.step < 3 ? `<button class="btn btn-primary" data-act="wNext">${t('next')} <span class="flip">←</span></button>` : `<button class="btn btn-primary" data-act="wSubmit">${editing ? t('saveChanges') : t('submitForApproval')}</button>`}</div></div>`;
};

V.attendees = () => {
  const e = ev(S.params.id); if (!e) return V.notFound();
  const regs = S.regs.filter(r => r.event === e.id && r.status === 'CONFIRMED');
  const q = S.attQ.toLowerCase();
  const shown = regs.filter(r => { const u = user(r.user); return !q || (u.name + u.nameEn + u.email).toLowerCase().includes(q); });
  // The demo only has a few named registrations; totals follow the event's seat count so the numbers match the cards.
  const total = Math.max(e.booked, regs.length);
  const inN = regs.filter(r => r.checkedInAt).length + (isPast(e) ? Math.round((total - regs.length) * 0.8) : 0);
  return `<button class="back" data-go="orgEvents"><span class="flip">→</span> ${t('back')}</button>` +
    pageHead(t('attTitle'), `${evT(e)} · ${fmtDT(e.startsAt)}`, ['14']) +
    `<div class="grid g4" style="margin-bottom:20px">
      <div class="stat"><div class="v">${fmtN(total)}</div><div class="l">${t('registeredN')}</div></div>
      <div class="stat"><div class="v" style="color:var(--success-fg)">${fmtN(inN)}</div><div class="l">${t('checkedIn')}</div></div>
      <div class="stat"><div class="v">${fmtN(total - inN)}</div><div class="l">${t('notYet')}</div></div></div>
    <div class="layout-2"><div>
      <div class="spread" style="margin-bottom:12px"><div class="search" style="flex:1;min-width:200px">${ico('search')}<label class="sr" for="aq">${t('searchAtt')}</label><input id="aq" placeholder="${t('searchAtt')}" value="${esc(S.attQ)}"></div>
        <button class="btn btn-ghost btn-sm" data-act="csv">${ico('download')} ${t('exportCsv')}</button></div>
      ${shown.length ? `<div class="table-wrap"><table><thead><tr><th>${t('name')}</th><th>${t('email')}</th><th>${t('status')}</th><th>${t('checkInTime')}</th></tr></thead><tbody>
        ${shown.map(r => { const u = user(r.user); return `<tr><td><div class="row" style="flex-wrap:nowrap"><span class="avatar">${esc(initials(u))}</span>${esc(uname(u))}</div></td><td dir="ltr" style="text-align:start">${esc(u.email)}</td>
        <td>${r.checkedInAt ? `<span class="badge b-success">${ico('check')} ${t('checkedIn')}</span>` : `<span class="badge b-gray">${t('notYet')}</span>`}</td><td>${r.checkedInAt ? fmtTime(r.checkedInAt) : '—'}</td></tr>`; }).join('')}
      </tbody></table></div>${total > shown.length ? `<p class="small muted" style="margin-top:8px">${t('showingOf', fmtN(shown.length), fmtN(total))}</p>` : ''}` : empty('users', t('noAtt'), '', '')}
    </div>
    <div class="card" style="align-self:start"><h2>${t('scanTitle')}</h2>${openNote('openScanner')}
      <div style="aspect-ratio:4/3;max-height:240px;width:100%;background:var(--navy);border-radius:var(--radius-sm);display:grid;place-items:center;color:#C9D2E3;margin-bottom:12px;position:relative">
        <div style="height:70%;aspect-ratio:1;border:3px solid var(--teal-light);border-radius:12px" aria-hidden="true"></div><span class="small" style="position:absolute;bottom:8px">${ico('camera')}</span></div>
      <form id="scanForm"><label class="sr" for="sc">${t('scanPh')}</label><input class="input" id="sc" dir="ltr" placeholder="${t('scanPh')}" style="margin-bottom:8px">
        <div class="row"><button class="btn btn-primary" type="submit">${t('scanBtn')}</button><button class="btn btn-secondary" type="button" data-act="simScan" data-id="${e.id}">${t('simulate')}</button></div></form>
      <div id="scanMsg" aria-live="assertive" style="margin-top:10px"></div></div></div>`;
};

V.dash = () => {
  const pending = S.events.filter(e => e.status === 'PENDING');
  const stats = [[t('users'), USERS.length], [t('active'), S.events.filter(e => e.status === 'APPROVED' && !isPast(e)).length], [t('pending'), pending.length], [t('totalBookings'), S.events.reduce((s, e) => s + e.booked, 0)]];
  return pageHead(t('dashTitle'), t('dashSub'), ['17', '22']) +
    `<div class="grid g4" style="margin-bottom:20px">${stats.map(([l, v], i) => `<div class="stat"><div class="v" ${i === 2 && v ? 'style="color:var(--warning-fg)"' : ''}>${fmtN(v)}</div><div class="l">${l}</div></div>`).join('')}</div>
    <div class="card"><h2>${t('approvals')} (${fmtN(pending.length)})</h2>
    ${pending.length ? `<div class="stack">${pending.map(e => `<div class="bk" style="border-inline-start-color:var(--warning)"><div class="ico ${catCls(e.cat)}" aria-hidden="true">${ico(cat(e.cat).icon)}</div>
      <div class="info"><div class="ev-title" style="font-size:14px">${esc(evT(e))}</div><div class="meta">${esc(L(cat(e.cat)))} · ${fmtDT(e.startsAt)} · ${esc(L(venue(e.venue)))} · ${t('capacity')} ${fmtN(e.capacity)}</div><div class="small muted">${t('by')} ${esc(uname(user(e.org)))}</div></div>
      <div class="row"><button class="btn btn-primary btn-sm" data-act="approve" data-id="${e.id}">${ico('check')} ${t('approve')}</button><button class="btn btn-ghost btn-sm" style="color:var(--danger-fg)" data-act="reject" data-id="${e.id}">${t('reject')}</button></div></div>`).join('')}</div>`
      : `<p class="muted">${ico('check')} ${t('noApprovals')}</p>`}</div>
    <div class="card"><h2>${t('allEvents')}</h2><div class="table-wrap" style="border:0"><table><thead><tr><th>${t('event')}</th><th>${t('organizer')}</th><th>${t('date')}</th><th>${t('status')}</th><th>${t('actions')}</th></tr></thead><tbody>
    ${[...S.events].sort((a, b) => b.startsAt - a.startsAt).map(e => `<tr><td><strong>${esc(evT(e))}</strong></td><td>${esc(uname(user(e.org)))}</td><td style="white-space:nowrap">${fmtDate(e.startsAt)}</td>
      <td><span class="badge ${STATUS_B[e.status]}">${t(e.status)}</span></td><td><button class="btn btn-ghost btn-sm" style="color:var(--danger-fg)" data-act="delEv" data-id="${e.id}">${t('delete')}</button></td></tr>`).join('')}
    </tbody></table></div></div>`;
};

V.users = () => {

    <div class="table-wrap"><table><thead><tr><th>${t('name')}</th><th>${t('email')}</th><th>${t('role')}</th><th>${t('bookings')}</th><th>${t('status')}</th><th>${t('actions')}</th></tr></thead><tbody>
    ${list.map(u => { const self = u.id === me().id; return `<tr><td><div class="row" style="flex-wrap:nowrap"><span class="avatar">${esc(initials(u))}</span>${esc(uname(u))} ${self ? `<span class="small muted">${t('you')}</span>` : ''}</div></td>
      <td dir="ltr" style="text-align:start">${esc(u.email)}</td><td><span class="badge ${roleB[u.role]}">${t(u.role)}</span></td>
      <td>${fmtN(S.regs.filter(r => r.user === u.id && r.status === 'CONFIRMED').length)}</td>
      <td><span class="badge ${u.isActive ? 'b-success' : 'b-gray'}">${u.isActive ? t('activeS') : t('inactiveS')}</span></td>
      <td>${self ? '' : `<div class="row" style="flex-wrap:nowrap"><button class="btn btn-ghost btn-sm" data-act="toggleUser" data-id="${u.id}">${u.isActive ? t('deactivate') : t('activate')}</button>
        <button class="btn btn-ghost btn-sm" style="color:var(--danger-fg)" data-act="delUser" data-id="${u.id}">${t('delete')}</button></div>`}</td></tr>`; }).join('')}

V.cats = () => pageHead(t('catsTitle'), t('catsSub'), ['19']) +
  `<div class="layout-2"><div class="table-wrap"><table><thead><tr><th>${t('nameAr')}</th><th>${t('nameEn')}</th><th>${t('eventsCount')}</th><th>${t('actions')}</th></tr></thead><tbody>
  ${CATS.map(c => { const n = S.events.filter(e => e.cat === c.id).length; return `<tr><td>${ico(c.icon)} ${esc(c.ar)}</td><td dir="ltr" style="text-align:start">${esc(c.en)}</td><td>${t('eventsN', fmtN(n))}</td>
    <td><div class="row" style="flex-wrap:nowrap"><button class="btn btn-ghost btn-sm" data-act="editCat" data-id="${c.id}">${t('edit')}</button><button class="btn btn-ghost btn-sm" style="color:var(--danger-fg)" data-act="delCat" data-id="${c.id}">${t('delete')}</button></div></td></tr>`; }).join('')}
  </tbody></table></div>
  <div class="card" style="align-self:start"><h2>${t('add')}</h2><form id="catForm" novalidate>
    <div class="field"><label for="ca">${t('nameAr')} *</label><input class="input" id="ca" dir="rtl"></div>
    <div class="field"><label for="ce">${t('nameEn')} *</label><input class="input" id="ce" dir="ltr"></div><div class="err" id="cat-e" style="margin-bottom:8px"></div>
    <button class="btn btn-primary" type="submit">${t('add')}</button></form></div></div>`;

V.analytics = () => {
  const months = S.lang === 'ar' ? ['مايو', 'يونيو', 'يوليو', 'أغسطس', 'سبتمبر', 'أكتوبر'] : ['May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct'];
  const vals = [340, 120, 60, 210, 880, 1240], max = Math.max(...vals);
  const byCat = CATS.map(c => [c, S.events.filter(e => e.cat === c.id && e.status === 'APPROVED').length]);
  const totalCat = byCat.reduce((s, [, n]) => s + n, 0) || 1;
  const upcoming = S.events.filter(e => e.status === 'APPROVED' && !isPast(e)).sort((a, b) => a.startsAt - b.startsAt).slice(0, 4);
  const pred = e => Math.round(e.booked * ({ workshop: 0.82, seminar: 0.74, competition: 0.9, cultural: 0.68, sports: 0.71 }[e.cat]));
  const pm = Math.max(...upcoming.map(e => e.capacity), 1);
  return pageHead(t('anTitle'), t('anSub'), ['20']) +
    `<div class="grid g4" style="margin-bottom:20px">
      <div class="stat"><div class="v">${fmtN(76)}%</div><div class="l">${t('attRate')}</div></div>
      <div class="stat"><div class="v">${fmtN(4.3)}<span class="small muted">/5</span></div><div class="l">${t('avgRating')}</div></div>
      <div class="stat"><div class="v">${fmtN(S.events.filter(e => e.status === 'APPROVED' && Math.abs(e.startsAt - today) < 31 * DAY).length)}</div><div class="l">${t('monthEvents')}</div></div>
      <div class="stat"><div class="v">${fmtN(S.events.reduce((s, e) => s + e.booked, 0))}</div><div class="l">${t('totalBookings')}</div></div></div>
    <div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(320px,1fr))">
      <div class="card"><h2>${t('bookingsMonthly')}</h2><div class="bars" role="img" aria-label="${t('bookingsMonthly')}">${vals.map((v, i) => `<div class="bar-col"><span class="v">${fmtN(v)}</span><div class="bar" style="height:${v / max * 100}%"></div><span class="l">${months[i]}</span></div>`).join('')}</div></div>
      <div class="card"><h2>${t('byCategory')}</h2>${byCat.map(([c, n]) => `<div class="hbar"><span>${esc(L(c))}</span><div class="progress" style="height:10px"><span style="width:${n / totalCat * 100}%;background:var(--teal)"></span></div><span class="small muted">${fmtN(Math.round(n / totalCat * 100))}%</span></div>`).join('')}</div>
      <div class="card" style="grid-column:1/-1"><h2>${t('prediction')}</h2><p class="small muted" style="margin-bottom:8px">${t('predNote')}</p>
        <div class="row small" style="margin-bottom:6px"><span style="display:inline-block;width:12px;height:12px;background:var(--teal);border-radius:2px"></span>${t('registeredL')}<span style="display:inline-block;width:12px;height:12px;border:1.5px dashed var(--teal-dark);background:var(--teal-bg);border-radius:2px;margin-inline-start:12px"></span>${t('predicted')}</div>
        <div class="bars" style="height:200px">${upcoming.map(e => `<div class="bar-col"><div class="row" style="flex-wrap:nowrap;align-items:flex-end;gap:4px;height:100%;width:100%;justify-content:center">
          <div class="bar" style="height:${e.booked / pm * 100}%" title="${t('registeredL')}: ${e.booked}"></div><div class="bar pred" style="height:${pred(e) / pm * 100}%" title="${t('predicted')}: ${pred(e)}"></div></div>
          <span class="l" style="text-align:center">${esc(evT(e)).slice(0, 22)}</span><span class="v">${fmtN(e.booked)} → ${fmtN(pred(e))}</span></div>`).join('')}</div></div></div>`;
};

V.broadcast = () => {

    <div class="field"><label for="bt">${t('bcTitleF')} *</label><input class="input" id="bt" maxlength="80"><div class="err" id="bt-e"></div></div>
    <div class="field"><label for="bb">${t('bcBody')} *</label><textarea class="input" id="bb" maxlength="500"></textarea><div class="err" id="bb-e"></div></div>
    <button class="btn btn-primary" type="submit">${ico('megaphone')} ${t('bcSend')}</button></form></div>
    <div class="card" style="align-self:start"><h2>${t('recent')}</h2>${S.broadcasts.map(b => `<div class="nt" style="padding-inline:0"><span style="color:var(--teal-dark)">${ico('megaphone')}</span><div><div style="font-weight:600">${esc(L(b.title))}</div><div class="small muted">${fmtDT(b.createdAt)} · ${t('usersN', fmtN(b.sent))}</div></div></div>`).join('')}</div></div>`;

V.notFound = () => empty('compass', t('nfTitle'), t('nfSub'), `<button class="btn btn-primary" data-act="home">${t('home')}</button>`);

// ---------------------------------------------------------------- render

  const d = document.documentElement;
  d.lang = S.lang; d.dir = S.lang === 'ar' ? 'rtl' : 'ltr';
  document.title = `${SCREEN_NAMES[S.lang][S.screen] || ''} · SCEMS Prototype`;

  const pb = document.getElementById('protoBar');
  pb.innerHTML = `<strong>${t('protoTitle')}</strong><span>(${t('protoNote')})</span>
    <label>${t('screen')}: <select id="pScreen">${SCREENS.map(([id, role, frs]) => `<option value="${id}" ${S.screen === id ? 'selected' : ''}>${SCREEN_NAMES[S.lang][id]}${role ? ` · ${t(role)}` : ''} (${frs})</option>`).join('')}</select></label>
    <span class="seg" role="group" aria-label="${t('role')}">${['ATTENDEE', 'ORGANIZER', 'ADMIN'].map(r => `<button aria-pressed="${S.role === r}" data-prole="${r}">${t(r)}</button>`).join('')}</span>
    <label><input type="checkbox" id="pNotes" ${S.notes ? 'checked' : ''}> ${t('notesToggle')} (FR / OPEN)</label>
    <label>${t('states')}: <select id="pState">${[['normal', 'normal'], ['loading', 'loadingDemo'], ['error', 'errorDemo']].map(([v, k]) => `<option value="${v}" ${S.state === v ? 'selected' : ''}>${t(k)}</option>`).join('')}</select></label>
    <button class="btn btn-navy btn-sm" data-act="present" style="margin-inline-start:auto">${t('presentMode')}</button>`;
  pb.hidden = S.present;
  let fab = document.getElementById('showBar');
  if (S.present && !fab) { fab = document.createElement('button'); fab.id = 'showBar'; fab.className = 'show-bar'; fab.dataset.act = 'present'; document.body.appendChild(fab); }
  if (fab) { fab.hidden = !S.present; fab.textContent = t('showControls'); }
  // Deep link to the current screen, e.g. index.html#s=feed&lang=en (handy for the demo and for screenshots).
  const h = new URLSearchParams({ s: S.screen, lang: S.lang });
  if (S.params.id) h.set('id', S.params.id);
  if (S.present) h.set('present', '1');
  history.replaceState(null, '', '#' + h);

  const navItems = S.role ? NAV[S.role] : [];
  const u = me();
  const top = `<header class="topbar"><button class="brand" data-act="home" aria-label="${t('product')}"><span class="brand-icon" aria-hidden="true">S</span><span style="line-height:1.15;text-align:start">${t('short')}<br><span class="small" style="color:#C9D2E3;font-weight:500">${t('uni')}</span></span></button>
    ${S.role ? `<button class="icon-btn menu-btn" data-act="menu" aria-expanded="${S.navOpen}" aria-label="${t('menu')}">${ico('menu')}</button>
    <nav class="nav ${S.navOpen ? 'open' : ''}" aria-label="${t('menu')}">${navItems.map(([id, k]) => `<button data-go="${id}" ${S.screen === id ? 'aria-current="page"' : ''}>${t(k)}</button>`).join('')}</nav>` : ''}
    <div class="top-actions">
      ${S.role ? `<button class="icon-btn" data-go="notifications" aria-label="${t('notifications')}${unread() ? ` (${unread()})` : ''}">${ico('bell')}${unread() ? `<span class="count" aria-hidden="true">${fmtN(unread())}</span>` : ''}</button>` : ''}
      <button class="lang-toggle" data-act="lang" lang="${S.lang === 'ar' ? 'en' : 'ar'}">${t('switchLang')}</button>
      ${u ? `<div class="user-chip"><span class="avatar" aria-hidden="true">${esc(initials(u))}</span><span class="name">${esc(uname(u))}<br><span class="small" style="color:#C9D2E3">${t(u.role)}</span></span></div>
      <button class="icon-btn" data-act="logout" aria-label="${t('logout')}" title="${t('logout')}">${ico('logout')}</button>` : ''}
    </div></header>`;

  const content = S.state === 'loading' ? skeleton() : S.state === 'error' ? errorView() : (V[S.screen] || V.notFound)();
  document.getElementById('app').innerHTML = top + `<main id="main">${content}</main>`;
  const log = document.getElementById('chatLog'); if (log) log.scrollTop = log.scrollHeight;
}

// ---------------------------------------------------------------- actions
function book(eid) {
  const e = ev(eid);
  const r = { id: uid('r'), event: eid, user: me().id, status: 'CONFIRMED', code: code(), checkedInAt: null, createdAt: new Date() };
  S.regs.push(r); e.booked++;
  notify(me().id, 'BOOKING_CONFIRMATION', { ar: 'تم تأكيد حجزك', en: 'Booking confirmed' }, { ar: `حجزك في "${e.title}" مؤكد.`, en: `Your booking for "${e.title}" is confirmed.` });
  if (e.booked >= e.capacity) notify(e.org, 'CAPACITY_FULL', { ar: 'اكتملت السعة', en: 'Event is full' }, { ar: `وصلت "${e.title}" إلى الحد الأعلى.`, en: `"${e.title}" reached its maximum capacity.` });
  return r;
}
function setErr(id, key) {
  const el = document.getElementById(id + '-e'), input = document.getElementById(id);
  if (el) el.textContent = key ? t(key) : '';
  if (input) { input.classList.toggle('invalid', !!key); key ? input.setAttribute('aria-invalid', 'true') : input.removeAttribute('aria-invalid'); }
  return !key;
}
function validateStep(w) {
  const d = w.d, e = {};
  if (w.step === 1) { ['title', 'desc', 'cat'].forEach(k => { if (!String(d[k]).trim()) e[k] = 'E_REQUIRED'; }); }
  if (w.step === 2) {
    ['start', 'end', 'venue', 'capacity'].forEach(k => { if (!String(d[k]).trim()) e[k] = 'E_REQUIRED'; });
    if (d.start && new Date(d.start) <= new Date()) e.start = 'E_DATE';
    if (d.start && d.end && new Date(d.end) <= new Date(d.start)) e.end = 'E_TIME_ORDER';
    const v = venue(d.venue), c = +d.capacity;
    if (d.capacity && (!Number.isInteger(c) || c < 1 || (v && c > v.capacity))) e.capacity = 'E_CAPACITY';
  }
  w.errors = e; return !Object.keys(e).length;
}
const toLocalInput = dt => { const p = n => String(n).padStart(2, '0'); return `${dt.getFullYear()}-${p(dt.getMonth() + 1)}-${p(dt.getDate())}T${p(dt.getHours())}:${p(dt.getMinutes())}`; };

function chatReply(text) {
  const s = text.toLowerCase();
  const upcoming = S.events.filter(e => e.status === 'APPROVED' && !isPast(e)).sort((a, b) => a.startsAt - b.startsAt);
  if (S.role === 'ATTENDEE' && /احجز|حجز لي|book me|book a|^book/.test(s)) {
    const e = upcoming.find(x => x.booked < x.capacity && !myReg(x.id));
    return e ? { from: 'bot', text: t('chatSuggest', evT(e)), confirm: e.id } : { from: 'bot', text: t('chatFound', []) };
  }
  if (/حجوزات|my booking|bookings/.test(s)) {
    const list = S.regs.filter(r => r.user === me().id && r.status === 'CONFIRMED').map(r => ev(r.event)).filter(e => !isPast(e)).map(e => `• ${evT(e)} (${fmtDate(e.startsAt)})`);
    return { from: 'bot', text: t('chatMine', list) };
  }
  if (/مساعد|help/.test(s)) return { from: 'bot', text: t('chatHelp') };
  const hit = upcoming.filter(e => { const c = cat(e.cat); return [e.title, c.ar, c.en].some(x => s.split(/\s+/).some(w => w.length > 2 && x.toLowerCase().includes(w.replace(/^ال/, '')))); });
  return { from: 'bot', text: t('chatFound', hit.map(e => `• ${evT(e)} (${fmtDate(e.startsAt)})`)) };
}
function chatSend(text) {
  if (!text.trim()) return;
  S.chat.push({ from: 'user', text }); S.chat.push(chatReply(text)); render();
  const i = document.getElementById('cm'); if (i) i.focus();
}

document.addEventListener('click', ev_ => {
  const el = ev_.target.closest('[data-go],[data-act],[data-cat],[data-tab],[data-prole],[data-urole],[data-star],[data-quick]');
  if (!el) return;
  const ds = el.dataset;
  if (ds.go) return go(ds.go, { id: ds.id, reg: ds.reg });
  if (ds.cat) { S.feed.cat = ds.cat; return render(); }
  if (ds.tab) { S.bkTab = ds.tab; return render(); }
  if (ds.urole) { S.usrRole = ds.urole; return render(); }
  if (ds.prole) { S.role = ds.prole; S.loginNotice = null; return go(home()); }
  if (ds.star) { S.params.stars = +ds.star; return render(); }
  if (ds.quick) return chatSend(t(ds.quick));
  const id = ds.id;
  switch (ds.act) {
    case 'home': return go(home());
    case 'lang': S.lang = S.lang === 'ar' ? 'en' : 'ar'; S.chat = S.chat.length > 1 ? S.chat : []; return render();
    case 'menu': S.navOpen = !S.navOpen; return render();
    case 'logout': S.loginNotice = null; return go('login');
    case 'retry': S.state = 'normal'; return render();
    case 'present': S.present = !S.present; return render();
    case 'clearDate': S.feed.date = ''; return render();
    case 'clearFilters': S.feed = { cat: 'all', date: '', venue: 'any' }; return render();
    case 'book': return modal({ title: t('confirmBookT'), body: t('confirmBookB', evT(ev(id))), onConfirm: () => { const r = book(id); go('booked', { reg: r.id }); } });
    case 'cancelReg': {
      const r = S.regs.find(x => x.id === ds.reg);
      return modal({ title: t('cancelBookT'), body: t('cancelBookB', evT(ev(r.event))), confirmLabel: t('cancelBooking'), danger: true, onConfirm: () => { r.status = 'CANCELLED'; ev(r.event).booked--; render(); toast(t('bookingCancelled')); } });
    }
    case 'sendFb': {
      if (!S.params.stars) { document.getElementById('st-e').textContent = t('E_REQUIRED'); return; }
      S.regs.find(x => x.id === ds.reg).rated = true; S.bkTab = 'past'; go('bookings'); return toast(t('fbThanks'));
    }
    case 'markAll': S.notifs.forEach(n => { if (n.user === me().id) n.isRead = true; }); return render();
    case 'chatYes': {
      const e = ev(id); S.chat = S.chat.map(m => ({ ...m, confirm: null }));
      if (myReg(id) || e.booked >= e.capacity) { S.chat.push({ from: 'bot', text: t('fullMsg') }); return render(); }
      const r = book(id); S.chat.push({ from: 'bot', text: t('chatDone', r.code) }); return render();
    }
    case 'chatNo': S.chat = S.chat.map(m => ({ ...m, confirm: null })); S.chat.push({ from: 'bot', text: t('chatDeclined') }); return render();
    case 'delEv': {
      const e = ev(id);
      return modal({ title: t('deleteEvT'), body: t('deleteEvB', evT(e)), confirmLabel: t('delete'), danger: true, onConfirm: () => {
        S.regs.filter(r => r.event === id && r.status === 'CONFIRMED').forEach(r => notify(r.user, 'SYSTEM', { ar: 'أُلغيت فعالية', en: 'Event cancelled' }, { ar: `أُلغيت "${e.title}" وأُلغي حجزك.`, en: `"${e.title}" was cancelled, and so was your booking.` }));
        S.events = S.events.filter(x => x.id !== id); S.regs = S.regs.filter(r => r.event !== id); render(); toast(t('evDeleted')); } });
    }
    case 'editEv': {
      const e = ev(id);
      S.wizard = { step: 1, errors: {}, editId: id, d: { title: e.title, desc: e.desc, titleEn: e.titleEn || '', descEn: e.descEn || '', cat: e.cat, venue: e.venue, start: toLocalInput(e.startsAt), end: toLocalInput(e.endsAt), capacity: String(e.capacity) } };
      return go('create', { keep: true });
    }
    case 'wNext': if (validateStep(S.wizard)) S.wizard.step++; return render();
    case 'wPrev': S.wizard.errors = {}; S.wizard.step--; return render();
    case 'wSubmit': {
      const d = S.wizard.d, data = { title: d.title.trim(), desc: d.desc.trim(), titleEn: d.titleEn.trim() || null, descEn: d.descEn.trim() || null, cat: d.cat, venue: d.venue, startsAt: new Date(d.start), endsAt: new Date(d.end), capacity: +d.capacity };
      if (S.wizard.editId) { Object.assign(ev(S.wizard.editId), data); go('orgEvents'); return toast(t('saved')); }
      S.events.push({ id: uid('e'), ...data, booked: 0, status: 'PENDING', org: me().id });
      notify('u3', 'SYSTEM', { ar: 'فعالية جديدة بانتظار الاعتماد', en: 'New event waiting for approval' }, { ar: `"${data.title}" من ${user(me().id).name}.`, en: `"${data.title}" by ${user(me().id).nameEn}.` });
      go('orgEvents'); return toast(t('submitted'));
    }
    case 'simScan': {
      const r = S.regs.find(x => x.event === id && x.status === 'CONFIRMED' && !x.checkedInAt);
      const msg = r ? (r.checkedInAt = new Date(), t('scanOk', uname(user(r.user)))) : t('noAtt');
      render(); const m = document.getElementById('scanMsg'); if (m) m.innerHTML = `<div class="alert ${r ? 'alert-success' : 'alert-danger'}">${esc(msg)}</div>`; return;
    }
    case 'csv': return toast(t('exportCsv'));
    case 'approve': case 'reject': {
      const e = ev(id), ok = ds.act === 'approve';
      const doIt = () => {
        e.status = ok ? 'APPROVED' : 'REJECTED';
        notify(e.org, 'SYSTEM', ok ? { ar: 'تم اعتماد فعاليتك', en: 'Your event was approved' } : { ar: 'تم رفض فعاليتك', en: 'Your event was rejected' }, { ar: `"${e.title}"`, en: `"${e.title}"` });
        render(); toast(t(ok ? 'approvedMsg' : 'rejectedMsg'));
      };
      return ok ? doIt() : modal({ title: t('rejectT'), body: t('rejectB', evT(e)), confirmLabel: t('reject'), danger: true, onConfirm: doIt });
    }
    case 'toggleUser': {
      const u = user(id);
      if (!u.isActive) { u.isActive = true; return render(); }
      return modal({ title: t('deactT'), body: t('deactB', uname(u)), confirmLabel: t('deactivate'), danger: true, onConfirm: () => { u.isActive = false; render(); } });
    }
    case 'delUser': {
      const u = user(id);
      return modal({ title: t('deleteUserT'), body: t('deleteUserB', uname(u)), confirmLabel: t('delete'), danger: true, onConfirm: () => {
        USERS.splice(USERS.indexOf(u), 1); S.regs.filter(r => r.user === id && r.status === 'CONFIRMED').forEach(r => { const e = ev(r.event); if (e) e.booked--; });
        S.regs = S.regs.filter(r => r.user !== id); render(); toast(t('userDeleted')); } });
    }
    case 'newUser': return modal({ title: t('newAccount'), confirmLabel: t('createAccount'), content: `<div style="margin-top:12px">
        <div class="field"><label for="nu_n">${t('fullName')} *</label><input class="input" id="nu_n"><div class="err" id="nu_n-e"></div></div>
        <div class="field"><label for="nu_e">${t('email')} *</label><input class="input" id="nu_e" type="email" dir="ltr"><div class="err" id="nu_e-e"></div></div>
        <div class="field"><label for="nu_r">${t('role')} *</label><select class="input" id="nu_r"><option value="ORGANIZER">${t('ORGANIZER')}</option><option value="ADMIN">${t('ADMIN')}</option></select></div></div>`,
      onConfirm: () => {
        const n = document.getElementById('nu_n').value.trim(), em = document.getElementById('nu_e').value.trim();
        const ok = setErr('nu_n', n ? null : 'E_INVALID_NAME') & setErr('nu_e', /^\S+@\S+\.\S+$/.test(em) ? null : 'E_INVALID_EMAIL');
        if (!ok) return false;
        USERS.push({ id: uid('u'), name: n, nameEn: n, email: em, role: document.getElementById('nu_r').value, isActive: true }); render(); toast(t('accountCreated'));
      } });
    case 'editCat': {
      const c = cat(id);
      return modal({ title: t('edit'), confirmLabel: t('save'), content: `<div style="margin-top:12px"><div class="field"><label for="ec_a">${t('nameAr')} *</label><input class="input" id="ec_a" dir="rtl" value="${esc(c.ar)}"></div>
        <div class="field"><label for="ec_e">${t('nameEn')} *</label><input class="input" id="ec_e" dir="ltr" value="${esc(c.en)}"></div><div class="err" id="ec-e"></div></div>`,
        onConfirm: () => { const a = document.getElementById('ec_a').value.trim(), e = document.getElementById('ec_e').value.trim(); if (!a || !e) { document.getElementById('ec-e').textContent = t('E_REQUIRED'); return false; } c.ar = a; c.en = e; render(); toast(t('catSaved')); } });
    }
    case 'delCat': {
      const c = cat(id);
      if (S.events.some(e => e.cat === id)) return toast(t('catInUse'));
      return modal({ title: t('deleteCatT'), body: t('deleteCatB', L(c)), confirmLabel: t('delete'), danger: true, onConfirm: () => { CATS.splice(CATS.indexOf(c), 1); render(); toast(t('catDeleted')); } });
    }
  }
});

document.addEventListener('input', e => {
  const el = e.target;
  if (el.id === 'aq') { S.attQ = el.value; render(); const n = document.getElementById('aq'); n.focus(); n.setSelectionRange(n.value.length, n.value.length); }
  if (el.dataset.w) S.wizard.d[el.dataset.w] = el.value;
});
document.addEventListener('change', e => {
  const el = e.target;
  if (el.id === 'fd') { S.feed.date = el.value; render(); }
  if (el.id === 'fv') { S.feed.venue = el.value; render(); }
  if (el.id === 'pScreen') go(el.value);
  if (el.id === 'pState') { S.state = el.value; render(); }
  if (el.id === 'pNotes') { S.notes = el.checked; render(); }
  if (el.dataset.w === 'venue') { S.wizard.d.venue = el.value; render(); }
});
document.addEventListener('submit', e => {
  e.preventDefault();
  const id = e.target.id;
  if (id === 'loginForm') {
    const em = document.getElementById('le').value.trim(), pw = document.getElementById('lp').value;
    const u = USERS.find(x => x.email === em);
    if (!u || pw.length < 8) { document.getElementById('loginErr').innerHTML = `<div class="alert alert-danger" role="alert">${t('E_INVALID_CREDENTIALS')}</div>`; return; }
    if (!u.isActive) { document.getElementById('loginErr').innerHTML = `<div class="alert alert-danger" role="alert">${esc(T[S.lang] === T.ar ? 'هذا الحساب معطل. تواصل مع الإدارة.' : 'This account is disabled. Contact the administration.')}</div>`; return; }
    ROLE_USER[u.role] = u.id; S.role = u.role; S.loginNotice = null; return go(home());
  }
  if (id === 'regForm') {
    const n = document.getElementById('rn').value.trim(), em = document.getElementById('re').value.trim(), pw = document.getElementById('rp').value;
    const ok = setErr('rn', n ? null : 'E_INVALID_NAME') & setErr('re', /^\S+@\S+\.\S+$/.test(em) ? null : 'E_INVALID_EMAIL') & setErr('rp', pw.length >= 8 ? null : 'E_WEAK_PASSWORD');
    if (!ok) return document.querySelector('.input.invalid').focus();
    USERS.push({ id: uid('u'), name: n, nameEn: n, email: em, role: 'ATTENDEE', isActive: true });
    S.loginNotice = 'registered'; go('login'); S.params.as = 'ATTENDEE'; document.getElementById('le').value = em; return;
  }
  if (id === 'chatForm') { const i = document.getElementById('cm'); return chatSend(i.value); }
  if (id === 'scanForm') {
    const c = document.getElementById('sc').value.trim().toUpperCase();
    const r = S.regs.find(x => x.event === S.params.id && x.code === c && x.status === 'CONFIRMED');
    let cls = 'alert-danger', msg = t('scanBad');
    if (r && r.checkedInAt) msg = t('scanDup', uname(user(r.user)));
    else if (r) { r.checkedInAt = new Date(); cls = 'alert-success'; msg = t('scanOk', uname(user(r.user))); }
    render(); document.getElementById('scanMsg').innerHTML = `<div class="alert ${cls}" role="status">${esc(msg)}</div>`; return;
  }
  if (id === 'catForm') {
    const a = document.getElementById('ca').value.trim(), en = document.getElementById('ce').value.trim();
    if (!a || !en) { document.getElementById('cat-e').textContent = t('E_REQUIRED'); return; }
    CATS.push({ id: uid('c'), ar: a, en, icon: 'tag' }); render(); return toast(t('catSaved'));
  }
  if (id === 'bcForm') {
    const ti = document.getElementById('bt').value.trim(), bo = document.getElementById('bb').value.trim();
    const ok = setErr('bt', ti ? null : 'E_REQUIRED') & setErr('bb', bo ? null : 'E_REQUIRED');
    if (!ok) return;
    const active = USERS.filter(u => u.isActive);
    return modal({ title: t('bcConfirmT'), body: t('bcConfirmB', fmtN(active.length)), confirmLabel: t('bcSend'), onConfirm: () => {
      active.forEach(u => notify(u.id, 'BROADCAST', { ar: ti, en: ti }, { ar: bo, en: bo }));
      S.broadcasts.unshift({ title: { ar: ti, en: ti }, sent: active.length, createdAt: new Date() }); render(); toast(t('bcSent')); } });
  }
});

// Start from the deep link if there is one: #s=<screen>&lang=ar|en&id=<event>&present=1
{
  const h = new URLSearchParams(location.hash.slice(1));
  if (h.get('lang') === 'en') S.lang = 'en';
  if (h.get('present') === '1') S.present = true;
  const s = h.get('s');
  if (s && SCREENS.some(x => x[0] === s)) go(s, { id: h.get('id') || undefined }); else render();
}
